<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle with glow -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient)" filter="url(#glow)" />
  <!-- Letter M with enhanced styling -->
  <text x="256" y="380" font-family="Inter, Arial, sans-serif" font-size="400" font-weight="900" text-anchor="middle" fill="white" stroke="rgba(52,211,153,0.8)" stroke-width="6" filter="url(#glow)">M</text>
</svg>
